[package]
name = "witness-gen"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Build a SimInput (tx + eth_getProof witness) for the on-device simulator from a JSON-RPC node"

[dependencies]
sim-types = { path = "../../crates/sim-types" }
alloy = { version = "2.4.2", default-features = false, features = ["providers", "provider-http", "rpc-types", "consensus", "reqwest-rustls-tls"] }
alloy-primitives = { version = "1.6.1" }
alloy-rlp = { version = "0.3.16" }
anyhow = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
