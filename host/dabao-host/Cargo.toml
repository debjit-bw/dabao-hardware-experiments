[package]
name = "dabao-host"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Host companion: build SimInputs from a JSON-RPC node (eth_getProof) and send them to the Dabao verifier"

[dependencies]
sim-types = { path = "../../crates/sim-types" }
# the device's simulator, run on the host to check replays against the chain
xous-evm = { path = "../../crates/xous-evm" }
clear-sign = { path = "../../crates/clear-sign" }
policy = { path = "../../crates/policy" }
serde_json = "1"
alloy = { version = "2.4.2", default-features = false, features = ["providers", "provider-http", "rpc-types", "consensus", "k256", "json-abi", "reqwest-rustls-tls", "network", "signers", "signer-local", "sol-types", "rand"] }
alloy-primitives = { version = "1.6.1" }
alloy-rlp = { version = "0.3.16" }
alloy-trie = { version = "0.9.5" }
anyhow = "1.0"
hidapi = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
