[package]
name = "sce-hash"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Keccak-256 (and SHA-256) on the Baochip's combohash engine, self-tested at startup, with a software fallback; plugs into alloy-primitives' native-keccak hook"

[dependencies]
alloy-primitives = { version = "1.6.1", default-features = false }
sha2 = { version = "0.10", default-features = false }
digest = { version = "0.10", default-features = false }

[target.'cfg(target_os = "xous")'.dependencies]
log = "0.4.14"
xous = "0.9.71"
utralib = { version = "0.1.27", default-features = false, features = ["bao1x"] }
