[package]
name = "xous-evm"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Witness-verified single-transaction EVM simulation (paradigmxyz/stateless tries + revm), no Xous deps"

[dependencies]
sim-types = { path = "../sim-types" }
stateless = { git = "https://github.com/paradigmxyz/stateless", tag = "reth-guest-v0.1.0-rc.9" }
tries = { git = "https://github.com/paradigmxyz/stateless", tag = "reth-guest-v0.1.0-rc.9", default-features = false }
revm = { version = "43.0.1", default-features = false, features = ["std"] }
alloy-evm = { version = "0.39.0", default-features = false }
alloy-rlp = { version = "0.3.16", default-features = false }
reth-chainspec = { git = "https://github.com/paradigmxyz/reth", rev = "db702b511a9dfe5a80ef76685dd93652ffe37cc5", default-features = false }
reth-primitives-traits = { version = "0.7.0", default-features = false }
alloy-consensus = { version = "2.4.2", default-features = false }
alloy-eips = { version = "2.4.2", default-features = false }
alloy-genesis = { version = "2.4.2", default-features = false }
alloy-primitives = { version = "1.6.1", default-features = false }

[dev-dependencies]
alloy-consensus = { version = "2.4.2", default-features = false }
