[package]
name = "transport"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Process 1 of 3: untrusted host transport (USB HID on the device, TCP in the emulator)"

[[bin]]
name = "transport"
path = "src/main.rs"

[dependencies]
log = "0.4.14"
xous = "0.9.71"
xous-names = { package = "xous-api-names", version = "0.9.72" }
log-server = { package = "xous-api-log", version = "0.1.70" }
sim-types = { path = "../sim-types" }

# device builds only: the dabao vendor HID interface (as eth-burner)
usb-bao1x = { path = "../../../dabao-workshop/xous-core/services/usb-bao1x", optional = true }
# not used directly: the usb-bao1x client needs bao1x-api's std items
bao1x-api = { path = "../../../dabao-workshop/xous-core/libs/bao1x-api", optional = true, features = ["std"] }
utralib = { version = "0.1.27", optional = true, default-features = false }

[features]
board-dabao = ["usb-bao1x", "bao1x-api"]
bao1x = ["utralib/bao1x"]
