[package]
name = "verifier"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Process 2 of 3: witness verification + EVM simulation (+ checks), a Xous server in the system image"

[[bin]]
name = "verifier"
path = "src/main.rs"

[dependencies]
log = "0.4.14"
xous = "0.9.71"
xous-names = { package = "xous-api-names", version = "0.9.72" }
log-server = { package = "xous-api-log", version = "0.1.70" }
sim-types = { path = "../sim-types" }
xous-evm = { path = "../xous-evm" }
clear-sign = { path = "../clear-sign" }
policy = { path = "../policy" }
light-client = { path = "../light-client" }
alloy-consensus = { version = "2.4.2", default-features = false }
alloy-rlp = { version = "0.3.16", default-features = false }
alloy-primitives = { version = "1.6.1", default-features = false }
sce-hash = { path = "../sce-hash" }

[features]
# device build (no effect since the signer keeps the slots; kept so build scripts don't change)
board-dabao = []

# device: every alloy keccak256 (trie proofs, revm's KECCAK256/CREATE2, our code) goes through
# sce-hash's `native_keccak256`, i.e. the chip's hash engine once its boot self-test passed.
# Target-specific, so host and emulator builds keep software Keccak.
[target.'cfg(target_os = "xous")'.dependencies]
alloy-primitives = { version = "1.6.1", default-features = false, features = ["native-keccak"] }
