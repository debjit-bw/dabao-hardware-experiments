[package]
name = "signer"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Process 3 of 3: holds the key; signs only transactions the verifier approved, building the hash itself"

[[bin]]
name = "signer"
path = "src/main.rs"

[dependencies]
log = "0.4.14"
xous = "0.9.71"
xous-names = { package = "xous-api-names", version = "0.9.72" }
log-server = { package = "xous-api-log", version = "0.1.70" }
sim-types = { path = "../sim-types" }
alloy-rlp = { version = "0.3.16", default-features = false }
alloy-primitives = { version = "1.6.1", default-features = false }
alloy-consensus = { version = "2.4.2", default-features = false }
alloy-eips = { version = "2.4.2", default-features = false }
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
sha2 = "0.10"
zeroize = "1.7"
getrandom = "0.2"

# device builds only: keystore app slots (only the IPC types: the keystore crate is a server)
keystore-api = { path = "../../../dabao-workshop/xous-core/libs/keystore-api", optional = true, features = ["gen2", "app-keys"] }
xous-ipc = { version = "0.10.11", optional = true }
utralib = { version = "0.1.27", optional = true, default-features = false }

[features]
board-dabao = ["keystore-api", "xous-ipc"]
bao1x = ["utralib/bao1x"]
