[package]
name = "light-client"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Ethereum (Sepolia) sync-committee light client pieces: SSZ header roots, signing domains, BLS12-381 sync-aggregate verification (arkworks, already in the firmware via revm's EIP-2537 precompiles)"

[dependencies]
sim-types = { path = "../sim-types" }
ark-bls12-381 = { version = "0.6", default-features = false, features = ["curve"] }
ark-ec = { version = "0.6", default-features = false }
ark-ff = { version = "0.6", default-features = false }
ark-serialize = { version = "0.6", default-features = false }
sha2 = { version = "0.10", default-features = false }
alloy-primitives = { version = "1.6.1", default-features = false, features = ["rlp"] }
alloy-rlp = { version = "0.3.16", default-features = false, features = ["derive"] }
