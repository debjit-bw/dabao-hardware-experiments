[workspace]
resolver = "3"
members = ["crates/engine-spike", "crates/sim-types", "host/witness-gen"]

# Patches and profiles only take effect at the workspace root.
[patch.crates-io]
# Xous fork of getrandom (0.2.x). Relative to the repo root; assumes the default
# XOUS_CORE layout (../dabao-workshop/xous-core) until xous-core is a submodule.
getrandom = { path = "../dabao-workshop/xous-core/imports/getrandom" }

[profile.release]
codegen-units = 1
debug = false
strip = false
lto = "fat"
# "z" + abort: engine-spike 1.67 MB -> 1.04 MB loadable (unwind tables and landing pads gone).
# panic=abort on Xous is not yet verified at runtime.
opt-level = "z"
panic = "abort"
