[workspace]
resolver = "3"
members = [
    "crates/engine-spike",
    "crates/sim-types",
    "crates/xous-evm",
    "crates/clear-sign",
    "crates/verifier",
    "crates/transport",
    "crates/signer",
    "crates/keystore-probe",
    "host/dabao-host",
]

# Patches and profiles only take effect at the workspace root.
[patch.crates-io]
# Xous fork of getrandom (0.2.x). Relative to the repo root; assumes the default
# XOUS_CORE layout (../dabao-workshop/xous-core) until xous-core is a submodule.
getrandom = { path = "../dabao-workshop/xous-core/imports/getrandom" }
# as eth-burner: the transport's usb-bao1x (device builds) needs these
usb-device = { git = "https://github.com/betrusted-io/usb-device.git", branch = "main" }
utralib = { path = "../dabao-workshop/xous-core/utralib" }
svd2utra = { path = "../dabao-workshop/xous-core/svd2utra" }

[profile.release]
codegen-units = 1
debug = false
strip = false
lto = "fat"
# "z" + abort: engine-spike 1.67 MB -> 1.04 MB loadable (unwind tables and landing pads gone).
# panic=abort on Xous is not yet verified at runtime.
opt-level = "z"
panic = "abort"
