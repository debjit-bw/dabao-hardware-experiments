[workspace]
resolver = "3"
# xous-core (submodule) has its own workspace; its crates are path deps, not members
exclude = ["vendor"]
members = [
    "crates/engine-spike",
    "crates/sim-types",
    "crates/xous-evm",
    "crates/clear-sign",
    "crates/policy",
    "crates/light-client",
    "crates/lc-bench",
    "crates/verifier",
    "crates/transport",
    "crates/signer",
    "crates/keystore-probe",
    "crates/bio-dma-probe",
    "crates/slot-probe",
    "crates/hash-bench",
    "crates/sce-hash",
    "host/dabao-host",
    "tools/bao-mcp",
]

# Patches and profiles only take effect at the workspace root.
[patch.crates-io]
# Xous fork of getrandom (0.2.x). Relative to the repo root; assumes the default
# submodule vendor/xous-core.
getrandom = { path = "vendor/xous-core/imports/getrandom" }
# as eth-burner: the transport's usb-bao1x (device builds) needs these
usb-device = { git = "https://github.com/betrusted-io/usb-device.git", branch = "main" }
utralib = { path = "vendor/xous-core/utralib" }
svd2utra = { path = "vendor/xous-core/svd2utra" }

[profile.release]
codegen-units = 1
debug = false
strip = false
lto = "fat"
# "z" + abort: engine-spike 1.67 MB -> 1.04 MB loadable (unwind tables and landing pads gone).
# panic=abort is verified on the board.
opt-level = "z"
panic = "abort"
